<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Studio Admin – Ebony Fortunatow</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="admin.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet" />
</head>
<body class="adm-body">

  <header class="adm-header">
    <a href="index.html" class="adm-logo">EBONY FORTUNATOW</a>
    <div class="adm-header-right" id="adm-user" hidden>
      <span>Studio admin</span>
      <button type="button" class="adm-link" id="adm-logout">Log out</button>
    </div>
  </header>

  <!-- LOGIN -->
  <main class="adm-login" id="adm-login" hidden>
    <form class="adm-card adm-login-card" id="adm-login-form" novalidate>
      <h1>Studio Login</h1>
      <p class="adm-muted">Manage workshop dates, times and seats.</p>
      <label>Email<input name="email" type="email" autocomplete="username" required /></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required /></label>
      <p class="adm-error" id="adm-login-error" role="alert" hidden></p>
      <button type="submit" class="btn-solid adm-btn-full">Log in</button>
    </form>
  </main>

  <!-- DASHBOARD -->
  <main class="adm-main" id="adm-app" hidden>
    <nav class="adm-views" id="adm-views">
      <button type="button" class="adm-view active" data-view="students">Students</button>
      <button type="button" class="adm-view" data-view="availability">Availability</button>
    </nav>
    <div class="adm-title-row">
      <h1 id="adm-title">Students</h1>
      <p class="adm-muted" id="adm-subtitle"></p>
    </div>
    <p class="adm-error adm-banner" id="adm-app-error" role="alert" hidden></p>
    <nav class="adm-tabs" id="adm-tabs"></nav>
    <div id="adm-panel"></div>
  </main>

  <p class="adm-loading" id="adm-loading">Loading…</p>

  <div class="adm-savebar" id="adm-savebar" hidden>
    <span id="adm-save-status">You have unsaved changes</span>
    <div>
      <button type="button" class="btn-outline" id="adm-discard">Discard</button>
      <button type="button" class="btn-solid" id="adm-save">Save changes</button>
    </div>
  </div>

  <dialog class="adm-dialog" id="adm-move" aria-labelledby="adm-move-name">
    <form id="adm-move-form" novalidate>
      <h2 id="adm-move-name">Reschedule</h2>
      <p class="adm-muted" id="adm-move-from"></p>
      <label>1. Class<select name="workshop"></select></label>
      <label>2. Date<select name="date"></select></label>
      <label id="adm-move-other" hidden>Pick the date<input type="date" name="otherDate" /></label>
      <label>3. Time<select name="time"></select></label>
      <p class="adm-move-summary" id="adm-move-summary" hidden></p>
      <p class="adm-error" id="adm-move-error" role="alert" hidden></p>
      <div class="adm-dialog-actions">
        <button type="submit" class="btn-outline" value="cancel" formnovalidate>Cancel</button>
        <button type="submit" class="btn-solid" id="adm-move-confirm" disabled>Confirm</button>
      </div>
    </form>
    <div id="adm-move-done" hidden>
      <h2>Done</h2>
      <p id="adm-move-done-text"></p>
      <p class="adm-muted">No email has been sent, so let them know about the new date.</p>
      <div class="adm-dialog-actions">
        <button type="button" class="btn-solid" id="adm-move-close">Close</button>
      </div>
    </div>
  </dialog>

  <script src="admin.js"></script>
</body>
</html>
