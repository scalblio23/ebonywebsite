<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ebony Fortunatow – New Site Coming Soon</title>
  <meta name="description" content="Ebony Fortunatow ceramics workshops. Our new site is coming soon." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Roboto', sans-serif;
      font-weight: 300;
      color: #ffffff;
      background: #2a2520 url('5CDC1D22-C38A-4D5C-BE3D-EE88385D78F4.jpg') center / cover no-repeat;
    }
    .cs {
      position: relative;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 16px 88px;
    }
    .cs::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(42, 37, 32, 0.55);
    }
    .cs > * { position: relative; }
    .cs-logo {
      font-size: 13px;
      letter-spacing: 0.3em;
      margin-bottom: 48px;
    }
    h1 {
      font-size: clamp(30px, 6vw, 56px);
      font-weight: 300;
      letter-spacing: 0.18em;
      line-height: 1.25;
      margin-bottom: 24px;
    }
    p {
      max-width: 460px;
      font-size: 15px;
      line-height: 1.8;
      color: rgba(255, 255, 255, 0.85);
    }
    a.cs-email {
      display: inline-block;
      margin-top: 32px;
      padding: 12px 28px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      color: #ffffff;
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 0.15em;
      transition: background 0.2s, color 0.2s;
    }
    a.cs-email:hover { background: #ffffff; color: #2a2520; }
    .cs-foot {
      position: absolute;
      bottom: 24px;
      left: 0;
      right: 0;
      max-width: none;
      font-size: 11px;
      letter-spacing: 0.12em;
      color: rgba(255, 255, 255, 0.6);
    }
  </style>
  <script src="pixel.js"></script>
  <noscript><img height="1" width="1" style="display:none" alt="" src="https://www.facebook.com/tr?id=1157807033086418&ev=PageView&noscript=1" /></noscript>
</head>
<body>
  <main class="cs">
    <p class="cs-logo">EBONY FORTUNATOW</p>
    <h1>NEW SITE<br />COMING SOON</h1>
    <p>We're putting the finishing touches on our workshop dates and online booking. Check back soon.</p>
    <a class="cs-email" href="mailto:ebonyfortunatow@gmail.com">EBONYFORTUNATOW@GMAIL.COM</a>
    <p class="cs-foot">2 Ann St, Stepney SA 5069</p>
  </main>
</body>
</html>
